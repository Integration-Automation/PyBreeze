# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Development work, dependency bumps included, goes to dev; main takes
    # releases only, and every push to main publishes to PyPI.
    target-branch: "dev"
    # A new release waits 7 days before Dependabot proposes it, so a
    # compromised version is more likely to be found and yanked first.
    # Dependabot's own default is 3 days. Security updates are not delayed.
    cooldown:
      default-days: 7
    # ruff stays on 0.15 (dev_requirements.txt): 0.16 enables 413 rules by
    # default, and no workflow runs ruff, so a bump would pass and change what
    # `ruff check` reports. Moving to 0.16 is a decision, not an update.
    ignore:
      - dependency-name: "ruff"
        versions: [">=0.16"]
  # Workflow actions are pinned to commit SHAs with the version as a comment
  # (test/test_utils/test_workflow_actions.py); Dependabot moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    cooldown:
      default-days: 7
