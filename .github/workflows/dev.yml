name: PyBreeze Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        # Downloads are cached (PySide6 alone is hundreds of MB); pip still
        # resolves the newest versions from PyPI, so the run tests what a user
        # would install today
        cache: pip
        cache-dependency-path: |
          requirements.txt
          dev_requirements.txt
    - name: Update pip wheel setuptools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install dev dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Install test tooling
      run: python -m pip install pytest pytest-cov hypothesis
    - name: Install prthinker for the command-line contract test
      # prthinker is not on PyPI and needs Python 3.12+. One leg is enough to
      # check that the arguments and environment PyBreeze builds are still the
      # ones prthinker accepts (test/test_utils/test_prthinker_contract.py).
      if: matrix.python-version == '3.12'
      run: python -m pip install "prthinker[runner] @ https://github.com/JE-Chen/Code-Review-Framework-Combining-Large-Language-Models-and-Chain-of-Thought-Reasoning/archive/refs/heads/main.zip"
    - name: Run unit tests (pytest)
      run: python -m pytest test/test_utils/ -v --tb=short --cov=pybreeze --cov-branch --cov-report=xml
    - name: Upload coverage for analysis
      # One leg is enough; the scanner only consumes a single report.
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error
    - name: Run AutomationEditor With Debug Mode
      run: python ./test/unit_test/start_automation/start_automation_test.py
      env:
        PYTHONPATH: .
    - name: Extend AutomationEditor
      run: python ./test/unit_test/start_automation/extend_automation_test.py
      env:
        PYTHONPATH: .

  sonarcloud:
    # Pull requests only. SonarCloud's plan for this organization exposes results
    # for the main branch and for pull requests; an analysis pushed for `dev`
    # succeeds but its results are not readable, so scanning every push here
    # would spend CI time on numbers nobody can see. Fork pull requests are
    # skipped because they cannot read the token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        # Sonar needs the full history to attribute new code to the right commits.
        fetch-depth: 0
    - name: Download coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: coverage-xml
    - name: Read package version
      # Without a version, SonarCloud's "previous version" new-code baseline has
      # nothing to anchor to and counts the whole history as new -- which is how
      # new_lines came to exceed the project's total line count.
      id: version
      run: echo "value=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
    - name: SonarQube Cloud scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

  publish-dev:
    # The dev channel. A push to dev that passes the tests is built from dev.toml
    # and uploaded when it is still the tip of dev and ships something the newest
    # pybreeze_dev does not. scripts/dev_release.py picks the version from PyPI,
    # so nothing is committed back. The job waits for the tests alone: sonarcloud
    # is skipped on a push, and a skipped dependency would skip this job too.
    name: Publish pybreeze_dev to PyPI
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    # What is installed here runs next to the PyPI token, so every package is
    # locked to a version and a hash, wheels only, and the runner's pip stays
    # as it is. .github/requirements/publish.in lists the tools and says how
    # the lock is regenerated.
    - name: Install build tools
      run: "python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt"
    - name: Write pyproject.toml from dev.toml with the next version
      run: python scripts/dev_release.py prepare
    # --no-isolation: the backend is the setuptools locked in publish.txt. An
    # isolated build would download the newest one from PyPI as the job runs.
    - name: Build package
      run: python -m build --no-isolation
    - name: Verify distribution metadata
      run: python -m twine check dist/*
    - name: Compare with the newest published wheel
      id: compare
      run: python scripts/dev_release.py changed dist
    # A run that finishes after a newer push would otherwise publish older code
    # as the newest release.
    - name: Check that this commit is still the tip of dev
      id: tip
      run: |
        tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
        if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
        echo "current=$current" >> "$GITHUB_OUTPUT"
    - name: Publish to PyPI
      if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --non-interactive dist/*
