name: PyBreeze Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Update pip wheel setuptools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install dev dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Install test tooling
      run: python -m pip install pytest hypothesis
    - name: Run unit tests (pytest)
      run: python -m pytest test/test_utils/ -v --tb=short
    - name: Run AutomationEditor With Debug Mode
      run: python ./test/unit_test/start_automation/start_automation_test.py
      env:
        PYTHONPATH: .
    - name: Extend AutomationEditor
      run: python ./test/unit_test/start_automation/extend_automation_test.py
      env:
        PYTHONPATH: .

  sonarcloud:
    # Automatic Analysis is off, so branch and pull-request analysis both come
    # from here. Skipped on the nightly schedule, where re-scanning an unchanged
    # commit adds nothing, and on fork pull requests, which cannot read the token.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Sonar needs the full history to attribute new code to the right commits.
        fetch-depth: 0
    - name: SonarQube Cloud scan
      uses: SonarSource/sonarqube-scan-action@v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
