# SonarQube Cloud (SonarCloud) analysis, run from GitHub Actions.
#
# Automatic Analysis is deliberately off: it only ever looks at the main branch
# and at pull requests, which left `dev` unanalysed. CI-based analysis covers
# every branch the workflows run on, and the two modes are mutually exclusive.
sonar.projectKey=Integration-Automation_PyBreeze
sonar.organization=integration-automation

sonar.sources=pybreeze
sonar.tests=test
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
